<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Step 2: Choose your crop — Fieldwatch</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="layout.js" defer></script>
    <script src="crop.js" defer></script>
  </head>

  <body>
    <header class="site-header" id="site-header"></header>

    <main>
      <section class="page-hero section-wrap">
        <p class="eyebrow">Step 2</p>
        <h1>What do you want to grow?</h1>
        <p class="section-intro">Choose a crop and your land size. Not sure? Ask for suggestions.</p>
      </section>

      <section class="page-body section-wrap">
        <p class="fc-status" id="place-line" hidden></p>

        <div class="panel">
          <label class="field-label" for="crop-select">Crop</label>
          <select class="field" id="crop-select" data-crops data-remember></select>

          <label class="field-label" for="land-area">Land area (acres)</label>
          <input class="field" id="land-area" type="number" min="0" step="0.5" placeholder="For example 2" />

          <div class="button-row">
            <!-- FEATURE BUTTON: crop suggestion (working, see crop.js) -->
            <button class="btn btn-outline" id="suggest-btn" type="button" data-feature="crop-suggestion">Suggest better crops</button>
          </div>

          <p class="fc-status" id="crop-status" role="status" aria-live="polite" hidden></p>
          <div class="result-box" id="suggest-result" hidden></div>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </body>
</html>
