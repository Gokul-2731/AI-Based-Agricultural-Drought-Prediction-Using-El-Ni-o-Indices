<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Step 3: Profit or loss — Fieldwatch</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="layout.js" defer></script>
    <script src="profit.js" defer></script>
  </head>

  <body>
    <header class="site-header" id="site-header"></header>

    <main>
      <section class="page-hero section-wrap">
        <p class="eyebrow">Step 3</p>
        <h1>Your chance of profit or loss</h1>
        <p class="section-intro">
          Based on the rain forecast and the crop you chose.
          <a href="crop.html">Change crop</a>
        </p>
      </section>

      <section class="page-body section-wrap">
        <div class="panel">
          <p class="summary-line" id="summary-line"></p>
          <p class="fc-status" id="profit-status" role="status" aria-live="polite" hidden></p>
          <div class="result-box" id="profit-result" hidden></div>

          <div class="button-row">
            <!-- FEATURE BUTTON: profit/loss (working, see profit.js) -->
            <button class="btn btn-outline" id="profit-btn" type="button" data-feature="profit-loss">Calculate again</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </body>
</html>
